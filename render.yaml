# Render Blueprint for the Nigran 360 API. Secrets are entered in the Render dashboard
# (sync: false) and never committed.
services:
  - type: web
    name: nigran360-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTH_SECRET
        generateValue: true
      - key: PROCTORAI_DB_SERVER
        sync: false
      - key: PROCTORAI_DB_NAME
        sync: false
      - key: PROCTORAI_DB_USER
        sync: false
      - key: PROCTORAI_DB_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PROCTORAI_BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: PROCTORAI_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
